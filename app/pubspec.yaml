name: fretboard_trainer
description: Fretboard Trainer app.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^5.2.3
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/pluck-a2.wav
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 700
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
          weight: 400
    - family: Noto Music
      fonts:
        - asset: assets/fonts/NotoMusic-Regular.ttf
